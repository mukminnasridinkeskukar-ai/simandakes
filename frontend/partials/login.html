<!-- ==================== LOGIN PAGE ==================== -->
<div id="loginPage" class="login-page hidden">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h2 style="font-size:24px;font-weight:700;color:#111827;">Login Panel Admin</h2>
            <p style="color:#6b7280;">Masuk ke dashboard administrasi SIMANDAKES</p>
        </div>
        
        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" class="input input-with-icon" id="loginUsername" placeholder="Masukkan username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" class="input input-with-icon" id="loginPassword" placeholder="Masukkan password" required>
                </div>
            </div>
            
            <div id="loginError" class="alert alert-danger hidden"></div>
            
            <button type="submit" class="btn btn-danger w-full" id="loginBtn">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Masuk ke Dashboard
            </button>
        </form>
        
        <div style="text-align:center;margin-top:24px;">
            <button class="btn btn-secondary" onclick="showLanding()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Kembali ke Beranda
            </button>
        </div>
    </div>
</div>
