# Hasura Metadata untuk SIMANDAKES
# Format: Hasura Metadata v3

version: 3
sources:
  - name: default
    kind: postgres
    tables:
      - table:
          name: institusi
          schema: public
          select_permissions:
            - role: anon
              permission:
                columns: '*'
                filter: {}
                allow_aggregations: true
            - role: authenticated
              permission:
                columns: '*'
                filter: {}
                allow_aggregations: true
          insert_permissions:
            - role: authenticated
              permission:
                check: {}
                columns: '*'
          update_permissions:
            - role: authenticated
              permission:
                filter: {}
                columns: '*'
          delete_permissions:
            - role: authenticated
              permission:
                filter: {}

      - table:
          name: nakes
          schema: public
          select_permissions:
            - role: anon
              permission:
                columns: '*'
                filter: {}
                allow_aggregations: true
            - role: authenticated
              permission:
                columns: '*'
                filter: {}
                allow_aggregations: true
          insert_permissions:
            - role: authenticated
              permission:
                check: {}
                columns: '*'
          update_permissions:
            - role: authenticated
              permission:
                filter: {}
                columns: '*'
          delete_permissions:
            - role: authenticated
              permission:
                filter: {}

      - table:
          name: platform_links
          schema: public
          select_permissions:
            - role: anon
              permission:
                columns: '*'
                filter: {}
            - role: authenticated
              permission:
                columns: '*'
                filter: {}
          insert_permissions:
            - role: authenticated
              permission:
                check: {}
                columns: '*'
          update_permissions:
            - role: authenticated
              permission:
                filter: {}
                columns: '*'

      - table:
          name: user_profiles
          schema: public
          select_permissions:
            - role: authenticated
              permission:
                columns:
                  - id
                  - username
                  - nama
                  - role
                  - status
                  - last_login
                filter:
                  _or:
                    - id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: superadmin
          update_permissions:
            - role: authenticated
              permission:
                columns:
                  - nama
                filter:
                  id:
                    _eq: X-Hasura-User-Id
