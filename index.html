<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMANDAKES - Sistem Informasi & Manajemen Sumber Daya Kesehatan</title>
  
  <!-- CSS CDNs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #0d6efd;
      --dark-color: #1e293b;
      --sidebar-width: 260px;
      --sidebar-collapsed-width: 70px;
      --transition-speed: 0.3s;
      --bg-gradient: radial-gradient(circle at top left, rgba(13,110,253,0.14), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(20,184,166,0.16), transparent 30%),
        radial-gradient(circle at 30% 80%, rgba(245,158,11,0.14), transparent 34%);
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-gradient), #f8fafc; color: #334155; overflow-x: hidden; }
    #landing-page { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; transition: opacity 0.5s, visibility 0.5s; }
    .loader-icon { font-size: 4rem; color: #38bdf8; animation: heartbeat 1.5s infinite; }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 20%,60%{transform:scale(1.15)} 40%,80%{transform:scale(1)} }
    .progress-container { width: 250px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 20px; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #0ea5e9); border-radius: 3px; transition: width 0.1s linear; }
    #app-container { display: flex; min-height: 100vh; opacity: 0; transition: opacity 0.5s; }
    #app-container.loaded { opacity: 1; }
    #sidebar { width: var(--sidebar-width); background: var(--dark-color); color: #94a3b8; transition: width var(--transition-speed); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; bottom: 0; left: 0; z-index: 1030; }
    #sidebar.collapsed { width: var(--sidebar-collapsed-width); }
    .sidebar-brand { height: 70px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; overflow: hidden; }
    .sidebar-brand i { font-size: 1.8rem; color: #38bdf8; margin-right: 12px; }
    .sidebar-brand span { font-weight: 700; font-size: 1.2rem; color: #fff; transition: opacity var(--transition-speed); }
    #sidebar.collapsed .sidebar-brand span { opacity: 0; }
    .sidebar-menu { flex: 1; overflow-y: auto; padding: 15px 0; list-style: none; margin: 0; }
    .sidebar-menu::-webkit-scrollbar { width: 5px; }
    .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .menu-item { padding: 2px 15px; }
    .menu-link { display: flex; align-items: center; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; transition: all 0.2s; white-space: nowrap; font-size: 0.95rem; }
    .menu-link:hover, .menu-link.active { color: #fff; background: rgba(255,255,255,0.08); }
    .menu-link.active { background: var(--primary-color); }
    .menu-link i { font-size: 1.15rem; width: 25px; margin-right: 12px; text-align: center; }
    #sidebar.collapsed .menu-link i { margin-right: 0; }
    .menu-link span { transition: opacity var(--transition-speed); }
    #sidebar.collapsed .menu-link span { opacity: 0; pointer-events: none; }
    #content-wrapper { flex: 1; display: flex; flex-direction: column; margin-left: var(--sidebar-width); transition: margin-left var(--transition-speed); min-width: 0; }
    #sidebar.collapsed + #content-wrapper { margin-left: var(--sidebar-collapsed-width); }
    #header { height: 70px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; position: sticky; top: 0; z-index: 1020; }
    .toggle-sidebar-btn { background: none; border: none; color: #64748b; font-size: 1.25rem; cursor: pointer; padding: 5px 10px; border-radius: 5px; }
    .toggle-sidebar-btn:hover { background: #f1f5f9; color: var(--primary-color); }
    .header-nav { display: flex; align-items: center; gap: 15px; }
    #main-content { padding: 30px; flex: 1; }
    .dashboard-shell { max-width: 1440px; margin: 0 auto; }
    .dashboard-hero { position: relative; overflow: hidden; border-radius: 28px; padding: 34px; color: #fff; background: linear-gradient(135deg, rgba(15,23,42,0.92), rgba(2,132,199,0.82)), url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1600&q=80') center/cover; box-shadow: 0 24px 60px rgba(15,23,42,0.16); }
    .dashboard-hero::after { content: ''; position: absolute; inset: auto -80px -120px auto; width: 320px; height: 320px; border-radius: 50%; background: rgba(255,255,255,0.16); }
    .dashboard-hero .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(10px); font-weight: 600; font-size: 0.85rem; }
    .dashboard-hero h1 { font-size: clamp(2rem, 4vw, 4rem); line-height: 1.05; letter-spacing: -0.04em; }
    .hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-top: 28px; }
    .hero-stat { padding: 16px; border-radius: 18px; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.16); backdrop-filter: blur(12px); }
    .hero-stat strong { display: block; font-size: 1.5rem; font-weight: 800; }
    .hero-stat span { color: rgba(255,255,255,0.78); font-size: 0.8rem; }
    .section-title { color: #0f172a; font-weight: 800; letter-spacing: -0.03em; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 26px; }
    .entrepreneur-card { position: relative; overflow: hidden; min-height: 330px; border: 0; border-radius: 26px; padding: 0; cursor: pointer; color: #fff; background: #fff; box-shadow: 0 20px 45px rgba(15,23,42,0.12); transition: transform 0.25s, box-shadow 0.25s; isolation: isolate; }
    .entrepreneur-card::before { content: ''; position: absolute; inset: 0; z-index: -2; background: linear-gradient(135deg, var(--card-start), var(--card-end)); transition: transform 0.35s; }
    .entrepreneur-card::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.28), transparent 24%), linear-gradient(to top, rgba(2,6,23,0.78), rgba(2,6,23,0.08)); }
    .entrepreneur-card:hover { transform: translateY(-8px); box-shadow: 0 28px 60px rgba(15,23,42,0.2); }
    .entrepreneur-card:hover::before { transform: scale(1.08) rotate(1deg); }
    .card-photo { height: 150px; object-fit: cover; width: 100%; filter: saturate(1.08); }
    .card-body-custom { padding: 20px; }
    .card-icon-pill { width: 54px; height: 54px; display: inline-flex; align-items: center; justify-content: center; border-radius: 18px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(10px); margin-bottom: 16px; font-size: 1.35rem; }
    .entrepreneur-card h3 { font-size: 1.15rem; font-weight: 800; line-height: 1.25; margin-bottom: 8px; }
    .entrepreneur-card p { color: rgba(255,255,255,0.78); font-size: 0.88rem; line-height: 1.55; margin-bottom: 16px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: rgba(255,255,255,0.82); font-size: 0.8rem; }
    .card-theme-blue { --card-start: #2563eb; --card-end: #06b6d4; }
    .card-theme-green { --card-start: #059669; --card-end: #10b981; }
    .card-theme-orange { --card-start: #f97316; --card-end: #ef4444; }
    .card-theme-violet { --card-start: #7c3aed; --card-end: #ec4899; }
    .card-theme-slate { --card-start: #334155; --card-end: #64748b; }
    .table-card { border-radius: 18px; overflow: hidden; background: #fff; border: 1px solid #e2e8f0; }
    .table-card thead th { background: #0f172a; color: #fff; font-weight: 700; }
    .table-card img.thumb { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; border: 2px solid #e2e8f0; transition: transform 0.2s; cursor: pointer; }
    .table-card img.thumb:hover { transform: scale(1.08); }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; font-size: 0.78rem; font-weight: 700; }
    .status-aktif { color: #047857; background: #d1fae5; }
    .status-nonaktif { color: #b91c1c; background: #fee2e2; }
    .status-warning { color: #a16207; background: #fef3c7; }
    .form-card { border-radius: 20px; border: 1px solid #e2e8f0; padding: 22px; background: #fff; }
    #footer { background: rgba(255,255,255,0.72); border-top: 1px solid #e2e8f0; padding: 15px 30px; text-align: center; color: #64748b; font-size: 0.875rem; }
    .modal-custom .modal-content { border: 0; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px rgba(15,23,42,0.3); }
    .modal-custom .modal-header { border-bottom: 0; padding: 24px 26px 10px; }
    .modal-custom .modal-body { padding: 10px 26px 26px; }
    .modal-hero { height: 190px; object-fit: cover; width: 100%; border-radius: 18px; margin-bottom: 18px; box-shadow: 0 12px 30px rgba(15,23,42,0.14); }
    .chart-container { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); margin-bottom: 20px; }
    .chart-container canvas { max-height: 320px; }
    @media (max-width: 1280px) { .menu-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } .hero-stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 768px) { #sidebar { transform: translateX(-100%); } #sidebar.active { transform: translateX(0); width: var(--sidebar-width); } #sidebar.active .menu-link span, #sidebar.active .sidebar-brand span { opacity: 1; } #content-wrapper { margin-left: 0 !important; } #sidebar.collapsed { transform: translateX(-100%); } .menu-grid { grid-template-columns: 1fr; } .hero-stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div id="landing-page">
    <div class="text-center animate__animated animate__fadeIn">
      <div class="mb-4"><i class="fa-solid fa-heart-pulse loader-icon"></i></div>
      <h1 class="fw-bold mb-2 tracking-wide text-uppercase" style="letter-spacing:2px;">SIMANDAKES</h1>
      <p class="text-white-50 px-3 fs-5">Sistem Informasi & Manajemen Sumber Daya Kesehatan</p>
      <div class="progress-container mx-auto"><div id="progress-bar" class="progress-bar-fill"></div></div>
      <small class="text-white-50 mt-2 d-block" id="loader-text">Memuat Sistem...</small>
    </div>
  </div>

  <div id="app-container">
    <aside id="sidebar">
      <div class="sidebar-brand"><i class="fa-solid fa-heart-pulse"></i><span>SIMANDAKES</span></div>
      <ul class="sidebar-menu" id="dynamic-sidebar-menu"><div class="text-center py-4 text-muted small"><i class="fas fa-spinner fa-spin"></i> Loading menu...</div></ul>
    </aside>
    <div id="content-wrapper">
      <header id="header">
        <div class="d-flex align-items-center gap-3">
          <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle Sidebar"><i class="fa-solid fa-bars"></i></button>
          <h5 class="m-0 fw-bold text-dark d-none d-sm-inline-block" id="current-page-title">SIMANDAKES Dashboard</h5>
        </div>
        <div class="header-nav" id="dynamic-header-nav"></div>
      </header>
      <main id="main-content">
        <div id="view-container">
          <div id="view-dashboard" class="view-content d-none"></div>
          <div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i><p class="mt-2 text-muted">Menyiapkan halaman...</p></div>
        </div>
      </main>
      <footer id="footer"><div>&copy; 2026 <strong>SIMANDAKES</strong>. Hak Cipta Dilindungi.</div><div class="text-muted small mt-1">Sistem Informasi dan Manajemen Sumber Daya Kesehatan</div></footer>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    let appMenus = [];
    let activeDataTables = {};
    let dashboardCards = [];
    const cardThemeMap = { sdmk:'card-theme-blue', fasyankes:'card-theme-green', praktik_nakes:'card-theme-orange', dokter_spesialis:'card-theme-violet', kotak_saran:'card-theme-slate' };
    const cardPhotoMap = {
      sdmk:'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?auto=format&fit=crop&w=900&q=80',
      fasyankes:'https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=900&q=80',
      praktik_nakes:'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=80',
      dokter_spesialis:'https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&fit=crop&w=900&q=80',
      kotak_saran:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80'
    };
    const cardDescMap = {
      sdmk: 'Kelola data tenaga kesehatan, profesi, STR, tempat kerja, dan status aktif.',
      fasyankes: 'Informasi fasilitas kesehatan, jenis layanan, pimpinan, alamat, dan status operasional.',
      praktik_nakes: 'Catatan praktik mandiri tenaga kesehatan dengan SIP, alamat, dan kontak layanan.',
      dokter_spesialis: 'Data praktik dokter spesialis, SIP, fasyankes mitra, dan jadwal pelayanan.',
      kotak_saran: 'Terima aspirasi, kritik, dan saran masyarakat untuk peningkatan layanan kesehatan.'
    };
    function getDashboardCards(menus) {
      return menus.map(menu => ({
        id: menu.id, name: menu.name, shortName: menu.name, icon: menu.icon, pageType: menu.pageType,
        theme: cardThemeMap[menu.id] || 'card-theme-blue',
        photo: cardPhotoMap[menu.id] || 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=80',
        desc: cardDescMap[menu.id] || 'Modul ' + menu.name,
        stat: menu.name, meta: 'Menu'
      }));
    }

    function runLandingPage() {
      const duration = 2000, startTime = Date.now(), progressBar = document.getElementById('progress-bar'), loaderText = document.getElementById('loader-text');
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime, progress = Math.min((elapsed/duration)*100, 100);
        progressBar.style.width = progress + '%';
        loaderText.innerText = progress < 40 ? 'Menghubungkan ke Server...' : progress < 85 ? 'Mengunduh Menu Konfigurasi...' : 'Menyiapkan Tampilan...';
        if (elapsed >= duration) { clearInterval(interval); finishLoading(); }
      }, 50);
    }

    function finishLoading() {
      document.getElementById('landing-page').style.opacity = '0';
      document.getElementById('landing-page').style.visibility = 'hidden';
      document.getElementById('app-container').classList.add('loaded');
      Swal.fire({ title: 'Selamat Datang!', text: 'SIMANDAKES berhasil dimuat.', icon: 'success', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
    }

    function initApp() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(menus => buildUI(menus)).withFailureHandler(() => buildUI(getMockMenus())).getMenu();
      } else { setTimeout(() => buildUI(getMockMenus()), 100); }
    }

    function getMockMenus() {
      const mockCards = [
        { id:'sdmk', name:'SDMK', icon:'fas fa-user-md', pageType:'sdmk' },
        { id:'fasyankes', name:'Fasyankes', icon:'fas fa-hospital', pageType:'fasyankes' },
        { id:'praktik_nakes', name:'Praktik Mandiri Nakes', icon:'fas fa-user-nurse', pageType:'praktik' },
        { id:'dokter_spesialis', name:'Praktik Dokter Spesialis', icon:'fas fa-stethoscope', pageType:'dokter' },
        { id:'kotak_saran', name:'Kotak Saran', icon:'fas fa-envelope', pageType:'saran' }
      ];
      return mockCards.map((card, idx) => ({ id:card.id, parent:'', name:card.name, icon:card.icon, pageType:card.pageType, order:idx+1 }));
    }

    function normalizeMenu(menu) {
      return {
        id: String(menu.ID || menu.id || '').trim(),
        parent: String(menu.ParentMenu || menu.parent || '').trim(),
        name: String(menu.MenuName || menu.name || '').trim(),
        icon: String(menu.Icon || menu.icon || 'fas fa-circle').trim(),
        pageType: String(menu.PageType || menu.pageType || '').trim(),
        order: Number(menu.OrderNo || menu.order || 0)
      };
    }

    function buildUI(menus) {
      appMenus = menus.map(normalizeMenu).filter(m => m.id && m.name);
      appMenus.sort((a,b) => a.order - b.order);
      renderSidebar(appMenus);
      renderHeaderNav(appMenus);
      renderDashboard(appMenus);
      document.querySelectorAll('#view-container > div:not(#view-dashboard)').forEach(el => el.remove());
      if (appMenus.length > 0) navigateTo(appMenus[0].id);
    }

    function renderSidebar(menus) {
      const container = document.getElementById('dynamic-sidebar-menu');
      container.innerHTML = '';
      menus.filter(m => !m.parent).forEach(menu => {
        const li = document.createElement('li');
        li.className = 'menu-item';
        li.innerHTML = `<a href="javascript:void(0)" class="menu-link" id="menu-link-${menu.id}" onclick="openDataModal('${menu.id}')"><i class="${menu.icon}"></i><span>${menu.name}</span></a>`;
        container.appendChild(li);
      });
    }

    function renderHeaderNav(menus) {
      const container = document.getElementById('dynamic-header-nav');
      container.innerHTML = '';
      menus.forEach(menu => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm btn-outline-primary d-none d-md-inline-flex align-items-center gap-1';
        btn.innerHTML = `<i class="${menu.icon} small"></i> ${menu.name}`;
        btn.onclick = () => openDataModal(menu.id);
        container.appendChild(btn);
      });
      const userDiv = document.createElement('div');
      userDiv.className = 'd-flex align-items-center gap-2 border-start ps-3 ms-1';
      userDiv.innerHTML = `
        <div class="text-end d-none d-lg-block">
          <div class="fw-bold small" style="line-height:1;">${adminSession ? escapeHtml(adminSession.nama) : 'Public Portal'}</div>
          <small class="text-muted text-xs">${adminSession ? escapeHtml(adminSession.role) : 'SIMANDAKES'}</small>
        </div>
        <button type="button" class="btn btn-sm ${adminSession ? 'btn-outline-danger' : 'btn-outline-dark'} rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:40px; height:40px;" onclick="${adminSession ? 'logoutAdmin()' : 'navigateToAdmin()'}">
          ${adminSession ? '<i class="fas fa-right-from-bracket"></i>' : '<i class="fas fa-user"></i>'}
        </button>
      `;
      container.appendChild(userDiv);
    }
    function renderDashboard(menus) {
      const container = document.getElementById('view-dashboard');
      if (!container) return;
      dashboardCards = getDashboardCards(menus);
      container.innerHTML = `
        <div class="dashboard-shell">
          <section class="dashboard-hero animate__animated animate__fadeInUp">
            <span class="hero-badge"><i class="fas fa-heart-pulse"></i> SIMANDAKES Entrepreneur Dashboard</span>
            <h1 class="mt-4 mb-3">Platform Data Kesehatan Modern</h1>
            <p class="mb-0" style="max-width: 760px; color: rgba(255,255,255,0.82); font-size: 1.05rem; line-height: 1.7;">Akses SDMK, Fasyankes, Praktik Mandiri Nakes, Praktik Dokter Spesialis, dan Kotak Saran dalam satu tampilan interaktif modern.</p>
            <div class="hero-stats">
              <div class="hero-stat"><strong>5</strong><span>Menu Utama</span></div>
              <div class="hero-stat"><strong>100%</strong><span>Card Interaktif</span></div>
              <div class="hero-stat"><strong>DataTables</strong><span>Semua Tabel</span></div>
              <div class="hero-stat"><strong>Lightbox</strong><span>Semua Foto</span></div>
            </div>
          </section>
          <section class="mt-4">
            <div class="d-flex align-items-end justify-content-between gap-3">
              <div>
                <h2 class="section-title mb-1">Menu SIMANDAKES</h2>
                <p class="text-muted mb-0">Pilih card untuk melihat detail data dalam modal popup.</p>
              </div>
              <span class="badge rounded-pill text-bg-light border px-3 py-2 text-muted">
                <i class="fas fa-layer-group me-1"></i> 6 Modul Aktif
              </span>
            </div>
            <div class="menu-grid">
              ${dashboardCards.map(card => `
                <article class="entrepreneur-card ${card.theme} animate__animated animate__fadeInUp" data-menu-id="${card.id}" tabindex="0" role="button" aria-label="Buka modal ${card.name}">
                  <img class="card-photo" src="${card.photo}" alt="${escapeHtml(card.name)}" data-lightbox="${card.id}-hero" data-title="${escapeHtml(card.name)}">
                  <div class="card-body-custom">
                    <div class="card-icon-pill"><i class="${card.icon}"></i></div>
                    <h3>${card.name}</h3>
                    <p>${card.desc}</p>
                    <div class="card-meta">
                      <span>${card.stat}</span>
                      <span>Buka <i class="fas fa-arrow-right"></i></span>
                    </div>
                    <div class="card-meta mt-3">

    function normalizeData(rows, pageType) {
      return (rows || []).map(row => {
        const data = { ...row };
        if (pageType === 'sdmk') {
          data.foto = renderPhoto(data.foto, data.nama);
          data.status_aktif = renderStatus(data.status_aktif);
        } else if (pageType === 'fasyankes') {
          data.foto = renderPhoto(data.foto, data.nama);
          data.status_operasional = renderStatus(data.status_operasional);
        } else if (pageType === 'praktik' || pageType === 'dokter') {
          data.foto = renderPhoto(data.foto, data.nama);
        } else if (pageType === 'saran') {
          data.tanggal = formatDate(data.tanggal);
        }
        return data;
      });

    function renderStatus(status) {
      const value = String(status || '').toLowerCase();

      if (value === 'tidak aktif' || value === 'nonaktif') return `<span class="status-pill status-nonaktif"><i class="fas fa-circle-xmark"></i>${escapeHtml(label)}</span>`;
      if (value === 'pending') return `<span class="status-pill status-warning"><i class="fas fa-clock"></i>${escapeHtml(label)}</span>`;
      return `<span class="status-pill status-warning"><i class="fas fa-info-circle"></i>${escapeHtml(label)}</span>`;

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);

    }

          <div class="module-icon"><i class="fas fa-clipboard-list"></i></div>
          <h3>AuditTrail</h3>
          <p class="mb-3" style="color: rgba(255,255,255,0.78);">Pantau seluruh aktivitas admin.</p>
          <button type="button" class="btn btn-light btn-sm" onclick="openAuditTrail()">Buka AuditTrail</button>
        </article>
      ` : '';
      container.innerHTML = `
        <div class="admin-shell">
          <section class="admin-hero animate__animated animate__fadeInUp">
            <span class="hero-badge"><i class="fas fa-user-shield"></i> SIMANDAKES Panel Admin</span>
            <h1 class="mt-4 mb-3">Dashboard Administrator</h1>
            <p class="mb-0" style="max-width: 820px; color: rgba(255,255,255,0.84); line-height: 1.7;">Selamat datang, <strong>${escapeHtml(adminSession.nama)}</strong>. Anda login sebagai <span class="role-badge ${roleBadgeClass(adminSession.role)}">${escapeHtml(adminSession.role)}</span>.</p>
          </section>
          <div class="admin-module-grid">
            ${adminModules.map(module => `
              <article class="admin-module-card ${adminModuleClass(module.id)} animate__animated animate__fadeInUp">
                <div class="module-icon"><i class="${module.icon}"></i></div>
                <h3>${escapeHtml(module.name)}</h3>
                <p style="color: rgba(255,255,255,0.78);">Tambah, edit, hapus data, upload foto, export Excel, dan export PDF.</p>
                <div class="d-flex gap-2 flex-wrap">
                  <button type="button" class="btn btn-light btn-sm" onclick="openAdminModule('${module.id}')">Buka Data</button>
                  <button type="button" class="btn btn-outline-light btn-sm" onclick="exportAdminFile('${module.id}', 'excel')">Export Excel</button>
                  <button type="button" class="btn btn-outline-light btn-sm" onclick="exportAdminFile('${module.id}', 'pdf')">Export PDF</button>
                </div>
              </article>
            `).join('')}
            ${auditCard}
          </div>
        </div>
      `;
    }
    function openAdminModule(moduleId) {
      activeAdminModule = moduleId;
      const container = document.getElementById('view-admin');
      const module = adminModules.find(item => item.id === moduleId);
      if (!container || !module) return;
      container.innerHTML = `
        <div class="admin-shell">
          <div class="admin-toolbar">
            <div>
              <button type="button" class="btn btn-outline-dark btn-sm" onclick="navigateToAdmin()">
                <i class="fas fa-arrow-left me-1"></i>Kembali
              </button>
              <span class="ms-2 text-muted">${escapeHtml(module.name)}</span>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <button type="button" class="btn btn-dark btn-sm" onclick="openAdminForm('${module.id}', null)">
                <i class="fas fa-plus me-1"></i>Tambah Data
              </button>
              <button type="button" class="btn btn-success btn-sm" onclick="exportAdminFile('${module.id}', 'excel')">
                <i class="fas fa-file-excel me-1"></i>Export Excel
              </button>
              <button type="button" class="btn btn-danger btn-sm" onclick="exportAdminFile('${module.id}', 'pdf')">
                <i class="fas fa-file-pdf me-1"></i>Export PDF
              </button>
            </div>
          </div>
          <div class="admin-panel-card">
            <div id="admin-module-content" class="text-center py-4">
              <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
              <p class="mt-3 text-muted">Memuat data...</p>
            </div>
          </div>
        </div>
      `;
      loadAdminModuleData(moduleId);
    }
    function loadAdminModuleData(moduleId) {
      const content = document.getElementById('admin-module-content');
      if (!content) return;
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        content.innerHTML = `<div class="alert alert-warning">Mode lokal: koneksi Google Apps Script tidak tersedia.</div>`;
        return;
      }
      google.script.run.withSuccessHandler(function(result) {
        if (!result.ok) {
          content.innerHTML = `<div class="alert alert-danger">${escapeHtml(result.message)}</div>`;
          return;
        }
        renderAdminDataTable(content, moduleId, result.data || []);
      }).withFailureHandler(function(err) {
        content.innerHTML = `<div class="alert alert-danger">Gagal memuat data: ${escapeHtml(String(err))}</div>`;
      }).getAdminData(moduleId);
    }
    function renderAdminDataTable(content, moduleId, rows) {
      const module = adminModules.find(item => item.id === moduleId);
      const tableId = `admin-datatable-${moduleId}`;
      if (activeAdminTables[tableId]) {
        activeAdminTables[tableId].destroy();
        delete activeAdminTables[tableId];
      }
      const columns = getAdminTableColumns(module).concat({
        title: 'Aksi',
        data: null,
        orderable: false,
        searchable: false,
        render: function(data, type, row) {
          return `
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-sm btn-outline-primary admin-edit-btn" data-table="${tableId}">
                <i class="fas fa-edit"></i>
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger admin-delete-btn" data-id="${escapeHtml(row.id)}">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          `;
        }
      });
      const data = rows.map(row => prepareAdminRow(module, row));
      content.innerHTML = `
        <div class="table-responsive">
          <table id="${tableId}" class="table table-hover align-middle admin-table-card">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      `;
      const idIndex = Math.max(1, columns.findIndex(column => column.data === 'id'));
      activeAdminTables[tableId] = $(`#${tableId}`).DataTable({
        data,
        columns,
        language: {
          search: 'Cari:',
          lengthMenu: 'Tampilkan _MENU_ data',
          info: 'Menampilkan _START_ sampai _END_ dari _TOTAL_ data',
          zeroRecords: 'Data tidak ditemukan',
          paginate: { first: 'Awal', last: 'Akhir', next: 'Berikutnya', previous: 'Sebelumnya' }
        },
        order: [[idIndex, 'asc']]
      });
    }
    function getAdminTableColumns(module) {
      return module.headers.map(field => ({
        title: field.label,
        data: field.key,
        render: function(data, type, row) {
          if (field.key === 'foto') return renderAdminPhoto(row._fotoUrl || data, row.nama || module.name);
          if (field.key === 'status_aktif' || field.key === 'status_operasional') return renderStatus(data);
          if (field.key === 'tanggal') return formatDate(data);
          return escapeHtml(data || '');
        }
      }));
    }
    function prepareAdminRow(module, row) {
      const prepared = { ...row };
      const fotoField = module.headers.find(field => field.key === 'foto');
      if (fotoField) {
        prepared._fotoUrl = row.foto || '';
        prepared.foto = renderAdminPhoto(prepared._fotoUrl, row.nama || module.name);
      }
      return prepared;
    }
    function renderAdminPhoto(src, title) {
      const safeSrc = String(src || '').trim();
      const safeTitle = String(title || 'Foto SIMANDAKES');
      if (!safeSrc) return '<span class="badge bg-secondary">Tidak ada foto</span>';
      return `<a href="${escapeHtml(safeSrc)}" data-lightbox="admin-photo" data-title="${escapeHtml(safeTitle)}"><img class="thumb" src="${escapeHtml(safeSrc)}" alt="${escapeHtml(safeTitle)}"></a>`;
    }
    function openAdminForm(moduleId, row) {
      const module = adminModules.find(item => item.id === moduleId);
      if (!module) return;
      adminEditingRow = row;
      const modal = document.createElement('div');
      modal.className = 'modal fade modal-custom';
      modal.id = 'admin-data-modal';
      modal.tabIndex = -1;
      modal.innerHTML = `
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <div>
                <h5 class="modal-title fw-bold">${row ? 'Edit Data' : 'Tambah Data'} - ${escapeHtml(module.name)}</h5>
                <p class="text-muted small mb-0">Foto opsional. Jika tidak mengganti foto, foto lama tetap digunakan.</p>
              </div>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body">
              <form id="admin-data-form">
                <div class="admin-form-grid">
                  ${renderAdminFormFields(module, row)}
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                  <button type="submit" class="btn btn-dark">
                    <i class="fas fa-save me-1"></i>Simpan
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      const bsModal = new bootstrap.Modal(modal);
      bsModal.show();
      modal.addEventListener('hidden.bs.modal', () => modal.remove());
    }
    function renderAdminFormFields(module, row) {
      return module.headers.map(field => {
        const value = row ? (row[field.key] || '') : '';
        const required = field.required ? 'required' : '';
        const readonly = field.key === 'id' ? 'readonly' : '';
        if (field.key === 'foto') {
          return `
            <div class="full-span">
              <label class="form-label fw-bold small">${field.label}</label>
              <input type="file" class="form-control" name="${field.key}" accept="image/*">
              ${value ? `<img class="photo-preview mt-3" src="${escapeHtml(value)}" alt="${escapeHtml(module.name)}">` : ''}
            </div>
          `;
        }
        if (field.type === 'textarea') {
          return `
            <div class="full-span">
              <label class="form-label fw-bold small">${field.label}</label>
              <textarea class="form-control" name="${field.key}" rows="4" ${required}>${escapeHtml(value)}</textarea>
            </div>
          `;
        }
        if (field.type === 'select') {
          const options = field.options || [];
          return `
            <div>
              <label class="form-label fw-bold small">${field.label}</label>
              <select class="form-select" name="${field.key}" ${required}>
                ${options.map(option => `<option value="${escapeHtml(option)}" ${String(value) === String(option) ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}
              </select>
            </div>
          `;
        }
        return `
          <div>
            <label class="form-label fw-bold small">${field.label}</label>
            <input type="text" class="form-control" name="${field.key}" value="${escapeHtml(value)}" ${required} ${readonly}>
          </div>
        `;
      }).join('');
    }
    async function handleAdminFormSubmit(form, moduleId) {
      const module = adminModules.find(item => item.id === moduleId);
      if (!module) return;
      const payload = {};
      const fotoFile = form.elements.foto && form.elements.foto.files && form.elements.foto.files[0] ? form.elements.foto.files[0] : null;
      module.headers.forEach(field => {
        if (field.key !== 'foto' && form.elements[field.key]) {
          payload[field.key] = form.elements[field.key].value;
        }
      });
      if (adminEditingRow) {
        payload.id = adminEditingRow.id || payload.id;
        if (fotoFile) {
          const uploadResult = await uploadAdminFile(fotoFile);
          if (!uploadResult.ok) throw new Error(uploadResult.message);
          payload.foto = uploadResult.url;
        } else {
          payload.foto = adminEditingRow._fotoUrl || adminEditingRow.foto || '';
        }
      } else if (fotoFile) {
        const uploadResult = await uploadAdminFile(fotoFile);
        if (!uploadResult.ok) throw new Error(uploadResult.message);
        payload.foto = uploadResult.url;
      }
      const result = await callAdmin('saveAdminData', moduleId, payload);
      if (!result.ok) throw new Error(result.message);
      const modal = bootstrap.Modal.getInstance(document.getElementById('admin-data-modal'));
      if (modal) modal.hide();
      loadAdminModuleData(moduleId);
      Swal.fire({ icon: 'success', title: 'Data berhasil disimpan', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
    }
    async function uploadAdminFile(file) {
      const base64 = await fileToBase64(file);
      return callAdmin('uploadAdminPhoto', {
        filename: file.name,
        mimeType: file.type || 'image/jpeg',
        file: base64
      });
    }
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    function callAdmin(method, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('Google Apps Script tidak tersedia'));
          return;
        }
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[method](...args);
      });
    }
    async function submitAdminLogin(form) {
      const payload = Object.fromEntries(new FormData(form).entries());
      const result = await callAdmin('login', payload);
      if (!result.ok) {
        Swal.fire({ icon: 'warning', title: result.message || 'Login gagal', timer: 1800, showConfirmButton: false });
        return;
      }
      adminSession = result.data;
      adminModules = [];
      renderHeaderNav(appMenus);
      renderAdminPanel();
      Swal.fire({ icon: 'success', title: 'Login berhasil', timer: 1200, showConfirmButton: false, toast: true, position: 'top-end' });
    }
    function deleteAdminRecord(moduleId, id) {
      Swal.fire({
        title: 'Hapus data?',
        text: 'Aktivitas ini akan dicatat di AuditTrail.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Ya, hapus',
        cancelButtonText: 'Batal'
      }).then(async function(confirm) {
        if (!confirm.isConfirmed) return;
        const result = await callAdmin('deleteAdminData', moduleId, id);
        if (!result.ok) {
          Swal.fire({ icon: 'error', title: result.message || 'Gagal menghapus data', timer: 1800, showConfirmButton: false });
          return;
        }
        loadAdminModuleData(moduleId);
        Swal.fire({ icon: 'success', title: 'Data berhasil dihapus', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
      });
    }
    async function exportAdminFile(moduleId, type) {
      const method = type === 'pdf' ? 'exportAdminPdf' : 'exportAdminExcel';
      const result = await callAdmin(method, moduleId);
      if (!result.ok) {
        Swal.fire({ icon: 'error', title: result.message || 'Export gagal', timer: 1800, showConfirmButton: false });
        return;
      }
      window.location.href = result.url;
      Swal.fire({ icon: 'success', title: 'Export berhasil', text: 'File siap diunduh.', timer: 1800, showConfirmButton: false, toast: true, position: 'top-end' });
    }
    function openAuditTrail() {
      const container = document.getElementById('view-admin');
      if (!container) return;
      container.innerHTML = `
        <div class="admin-shell">
          <div class="admin-toolbar">
            <button type="button" class="btn btn-outline-dark btn-sm" onclick="navigateToAdmin()">
              <i class="fas fa-arrow-left me-1"></i>Kembali
            </button>
            <button type="button" class="btn btn-dark btn-sm" onclick="loadAuditTrail()">
              <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
          </div>
          <div class="audit-card">
            <div id="admin-audit-content" class="text-center py-4">
              <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
              <p class="mt-3 text-muted">Memuat AuditTrail...</p>
            </div>
          </div>
        </div>
      `;
      loadAuditTrail();
    }
    function loadAuditTrail() {
      const content = document.getElementById('admin-audit-content');
      if (!content) return;
      callAdmin('getAuditTrail', {}).then(function(result) {
        if (!result.ok) {
          content.innerHTML = `<div class="alert alert-danger">${escapeHtml(result.message)}</div>`;
          return;
        }
        renderAuditTable(content, result.data || []);
      }).catch(function(err) {
        content.innerHTML = `<div class="alert alert-danger">Gagal memuat AuditTrail: ${escapeHtml(String(err))}</div>`;
      });
    }
    function renderAuditTable(content, rows) {
      const tableId = 'admin-audit-table';
      if (activeAdminTables[tableId]) {
        activeAdminTables[tableId].destroy();
        delete activeAdminTables[tableId];
      }
      content.innerHTML = `
        <div class="table-responsive">
          <table id="${tableId}" class="table table-hover align-middle admin-table-card">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      `;
      activeAdminTables[tableId] = $(`#${tableId}`).DataTable({
        data: rows,
        columns: [
          { title: 'Timestamp', data: 'timestamp', render: data => escapeHtml(formatDate(data)) },
          { title: 'Action', data: 'action', render: data => escapeHtml(data || '') },
          { title: 'By', data: 'by', render: data => escapeHtml(data || '') },
          { title: 'Username', data: 'username', render: data => escapeHtml(data || '') },
          { title: 'Role', data: 'role', render: data => escapeHtml(data || '') },
          { title: 'Module', data: 'module', render: data => escapeHtml(data || '') },
          { title: 'Record ID', data: 'record_id', render: data => escapeHtml(data || '') },
          { title: 'Payload', data: 'payload', render: data => escapeHtml(data || '') }
        ],
        order: [[0, 'desc']],
        language: {
          search: 'Cari:',
          lengthMenu: 'Tampilkan _MENU_ data',
          info: 'Menampilkan _START_ sampai _END_ dari _TOTAL_ data',
          zeroRecords: 'Data tidak ditemukan',
          paginate: { first: 'Awal', last: 'Akhir', next: 'Berikutnya', previous: 'Sebelumnya' }
        }
      });
    }
    function logoutAdmin() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function() {
          adminSession = null;
          adminModules = [];
          activeAdminModule = null;
          renderHeaderNav(appMenus);
          renderAdminPanel();
          Swal.fire({ icon: 'success', title: 'Logout berhasil', timer: 1200, showConfirmButton: false, toast: true, position: 'top-end' });
        }).withFailureHandler(function() {
          adminSession = null;
          adminModules = [];
          renderHeaderNav(appMenus);
          renderAdminPanel();
        }).logout();
      } else {
        adminSession = null;
        adminModules = [];
        renderHeaderNav(appMenus);
        renderAdminPanel();
      }
    }
    function roleBadgeClass(role) {
      if (role === 'Super Admin') return 'role-super';
      if (role === 'Admin SDMK') return 'role-sdmk';
      if (role === 'Admin Fasyankes') return 'role-fasyankes';
      return 'role-praktik';
    }
    function adminModuleClass(moduleId) {
      if (moduleId === 'sdmk') return 'module-blue';
      if (moduleId === 'fasyankes') return 'module-green';
      if (moduleId === 'praktik_nakes') return 'module-orange';
      if (moduleId === 'dokter_spesialis') return 'module-violet';
      return 'module-slate';
    }
    function navigateTo(menuId) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.add('d-none'));
      document.querySelectorAll('.menu-link, .submenu-link').forEach(el => el.classList.remove('active'));
      const activeMenu = appMenus.find(m => m.id === menuId);
      if (!activeMenu) return;
      document.getElementById('current-page-title').innerText = activeMenu.name;
      const sidebarLink = document.getElementById(`menu-link-${menuId}`);
      if (sidebarLink) sidebarLink.classList.add('active');
      const targetView = document.getElementById('view-dashboard');
      if (targetView) targetView.classList.remove('d-none');
    }
    $(document).ready(function() {
      $('#toggle-sidebar').on('click', function() { $(window).width() <= 768 ? $('#sidebar').toggleClass('active') : $('#sidebar').toggleClass('collapsed'); });
      $(document).on('click', function(e) { if ($(window).width() <= 768) { const s=$('#sidebar'), t=$('#toggle-sidebar'); if (!s.is(e.target) && s.has(e.target).length===0 && !t.is(e.target) && t.has(e.target).length===0) s.removeClass('active'); } });
      $(document).on('submit', '#form-saran', function(event) { event.preventDefault(); submitSaranForm(this); });
      $(document).on('submit', '#admin-login-form', function(event) { event.preventDefault(); submitAdminLogin(this); });
      $(document).on('submit', '#admin-data-form', function(event) { event.preventDefault(); handleAdminFormSubmit(this, activeAdminModule).catch(function(err) { Swal.fire({ icon: 'error', title: err.message || 'Gagal menyimpan data', timer: 2000, showConfirmButton: false }); }); });
      $(document).on('click', '.admin-edit-btn', function() { const tableId = $(this).data('table'); const row = activeAdminTables[tableId].row($(this).closest('tr')).data(); openAdminForm(activeAdminModule, row); });
      $(document).on('click', '.admin-delete-btn', function() { deleteAdminRecord(activeAdminModule, $(this).data('id')); });
      runLandingPage();
      initApp();
      initAdminSession();
    });
  </script>
</body>
</html>
